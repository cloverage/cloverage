name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test-cloverage:
    name: "cloverage / Clojure ${{ matrix.clojure }} / JDK ${{ matrix.java }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        clojure: ['1.11', '1.12']
        java: ['17', '21', '25']
    env:
      CLOJURE_VERSION: ${{ matrix.clojure }}
      CI: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: DeLaGuardo/setup-clojure@f556541eb28a9303896cee0679ba9f60b898300f # 13.5
        with:
          lein: 2.11.2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: m2-cloverage-${{ matrix.java }}-${{ matrix.clojure }}-${{ hashFiles('cloverage/project.clj') }}
          restore-keys: |
            m2-cloverage-${{ matrix.java }}-${{ matrix.clojure }}-
            m2-cloverage-${{ matrix.java }}-
      - name: Run tests
        working-directory: cloverage
        run: lein test-ci

  test-lein-cloverage:
    name: "lein-cloverage / JDK ${{ matrix.java }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: DeLaGuardo/setup-clojure@f556541eb28a9303896cee0679ba9f60b898300f # 13.5
        with:
          lein: 2.11.2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: m2-lein-cloverage-${{ matrix.java }}-${{ hashFiles('cloverage/project.clj', 'lein-cloverage/project.clj', 'lein-cloverage/test-resources/integration/project.clj') }}
          restore-keys: |
            m2-lein-cloverage-${{ matrix.java }}-
      - name: Run tests
        working-directory: lein-cloverage
        run: lein test-ci
      - name: Test plugin with the local library
        run: bash scripts/test-plugin-integration.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      CLOJURE_VERSION: '1.12'
      CI: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@f556541eb28a9303896cee0679ba9f60b898300f # 13.5
        with:
          lein: 2.11.2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: m2-lint-${{ hashFiles('cloverage/project.clj', 'lein-cloverage/project.clj') }}
          restore-keys: |
            m2-lint-
      - name: "cljfmt check (cloverage)"
        working-directory: cloverage
        run: lein cljfmt check
      - name: "cljfmt check (lein-cloverage)"
        working-directory: lein-cloverage
        run: lein cljfmt check
      - name: "eastwood (cloverage)"
        working-directory: cloverage
        run: lein eastwood-ci
      - name: "eastwood (lein-cloverage)"
        working-directory: lein-cloverage
        run: lein eastwood-ci
      - name: "clj-kondo (cloverage)"
        working-directory: cloverage
        run: lein kondo-ci
      - name: "clj-kondo (lein-cloverage)"
        working-directory: lein-cloverage
        run: lein kondo-ci

  bb-test:
    name: Babashka tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: DeLaGuardo/setup-clojure@f556541eb28a9303896cee0679ba9f60b898300f # 13.5
        with:
          bb: 1.13.226
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: bb-${{ hashFiles('cloverage/bb.edn') }}
          restore-keys: |
            bb-
      - name: Run bb tests
        working-directory: cloverage
        run: bb test:bb

  snapshot-packages:
    name: Prepare snapshot packages
    needs: [test-cloverage, test-lein-cloverage, lint, bb-test]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    env:
      CLOJURE_VERSION: '1.12'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: DeLaGuardo/setup-clojure@f556541eb28a9303896cee0679ba9f60b898300f # 13.5
        with:
          lein: 2.11.2
          bb: 1.13.226
          cli: 1.12.6.1673
      - name: Test Clojure snapshot publisher
        working-directory: scripts/publishing
        run: clojure -M:test
      - name: Package snapshots without publishing credentials
        run: |
          bb scripts/prepare-snapshots.clj target/snapshots
          (cd scripts/publishing && clojure -M -m publish ../../target/snapshots --check)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-packages
          path: target/snapshots
          if-no-files-found: error
          retention-days: 7

  publish-snapshots:
    name: Publish snapshots
    needs: snapshot-packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'cloverage/cloverage'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-snapshots
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: snapshot-packages
          path: target/snapshots
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: DeLaGuardo/setup-clojure@f556541eb28a9303896cee0679ba9f60b898300f # 13.5
        with:
          cli: 1.12.6.1673
      - name: Resolve publishing dependencies without credentials
        working-directory: scripts/publishing
        run: clojure -P
      - name: Check packages and current master commit
        id: current
        run: |
          (cd scripts/publishing && clojure -M -m publish ../../target/snapshots --check)
          if [[ "$(git ls-remote origin refs/heads/master | cut -f1)" == "$GITHUB_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipped publishing superseded commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload prepared snapshots to Clojars
        if: steps.current.outputs.publish == 'true'
        env:
          CLOJARS_USERNAME: lvh
          CLOJARS_CLOVERAGE_TOKEN: ${{ secrets.CLOJARS_CLOVERAGE_TOKEN }}
          CLOJARS_LEIN_CLOVERAGE_TOKEN: ${{ secrets.CLOJARS_LEIN_CLOVERAGE_TOKEN }}
        working-directory: scripts/publishing
        run: clojure -M -m publish ../../target/snapshots
