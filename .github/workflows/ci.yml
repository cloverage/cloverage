name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test-cloverage:
    name: "cloverage / Clojure ${{ matrix.clojure }} / JDK ${{ matrix.java }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        clojure: ['1.11', '1.12']
        java: ['17', '21', '25']
    env:
      CLOJURE_VERSION: ${{ matrix.clojure }}
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          lein: 2.11.2
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-cloverage-${{ matrix.java }}-${{ matrix.clojure }}-${{ hashFiles('cloverage/project.clj') }}
          restore-keys: |
            m2-cloverage-${{ matrix.java }}-${{ matrix.clojure }}-
            m2-cloverage-${{ matrix.java }}-
      - name: Run tests
        working-directory: cloverage
        run: lein test-ci

  test-lein-cloverage:
    name: "lein-cloverage / JDK ${{ matrix.java }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          lein: 2.11.2
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-lein-cloverage-${{ matrix.java }}-${{ hashFiles('cloverage/project.clj', 'lein-cloverage/project.clj', 'lein-cloverage/test-resources/integration/project.clj') }}
          restore-keys: |
            m2-lein-cloverage-${{ matrix.java }}-
      - name: Run tests
        working-directory: lein-cloverage
        run: lein test-ci
      - name: Test plugin with the local library
        run: bash scripts/test-plugin-integration.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      CLOJURE_VERSION: '1.12'
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          lein: 2.11.2
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-lint-${{ hashFiles('cloverage/project.clj', 'lein-cloverage/project.clj') }}
          restore-keys: |
            m2-lint-
      - name: "cljfmt check (cloverage)"
        working-directory: cloverage
        run: lein cljfmt check
      - name: "cljfmt check (lein-cloverage)"
        working-directory: lein-cloverage
        run: lein cljfmt check
      - name: "eastwood (cloverage)"
        working-directory: cloverage
        run: lein eastwood-ci
      - name: "eastwood (lein-cloverage)"
        working-directory: lein-cloverage
        run: lein eastwood-ci
      - name: "clj-kondo (cloverage)"
        working-directory: cloverage
        run: lein kondo-ci
      - name: "clj-kondo (lein-cloverage)"
        working-directory: lein-cloverage
        run: lein kondo-ci

  bb-test:
    name: Babashka tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          bb: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: bb-${{ hashFiles('cloverage/bb.edn') }}
          restore-keys: |
            bb-
      - name: Run bb tests
        working-directory: cloverage
        run: bb test:bb

  snapshots:
    name: Validate and publish snapshots
    needs: [test-cloverage, test-lein-cloverage, lint, bb-test]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    concurrency:
      group: snapshots-${{ github.ref }}
      cancel-in-progress: false
    env:
      CLOJURE_VERSION: '1.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: DeLaGuardo/setup-clojure@13.5
        with:
          lein: 2.11.2
          bb: latest
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-snapshots-${{ hashFiles('cloverage/project.clj', 'lein-cloverage/project.clj') }}
          restore-keys: |
            m2-snapshots-
      - name: Validate snapshot packaging and deployment
        run: bb scripts/publish-snapshots.clj --dry-run
      - name: Publish snapshots to Clojars
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'cloverage/cloverage'
        env:
          CLOJARS_USERNAME: lvh
          CLOJARS_PASSWORD: ${{ secrets.CLOJARSDEPLOYKEY }}
        run: |
          # An older build finishing late must not replace the current snapshot.
          if [[ "$(git ls-remote origin refs/heads/master | cut -f1)" != "$GITHUB_SHA" ]]; then
            echo "Skipped publishing superseded commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bb scripts/publish-snapshots.clj
